name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Every version reports, even when another one fails.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Only the dev extra, pytest. boto3, which only the simulator recorder needs, isn't
      # installed, and the job has no AWS credentials: the tests replay the recorded simulator
      # fixtures offline.
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run the tests
        run: python -m pytest
